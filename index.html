<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <title>Frontend Mentor | Blog preview card</title>
  <link rel="stylesheet" href="style.css">

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>
  <main>

      <article class="card">
        <img src="assets/images/illustration-article.svg" class="cover-img" alt="blog post cover image">
        <p class="blog-tag">Learning</p>
        <p class="publish-date">Published <time datetime="2023-12-21">21 Dec 2023</time> </p>
        <h1 class="blog-title"> <a href="#">HTML & CSS foundations</a> </h1>
        <p class="blog-description">These languages are the backbone of every website, defining structure, content, and presentation.</p>
        <div class="author">
          <img src="assets/images/image-avatar.webp" alt="Portrait of Greg Hooper">
          <p class="author-name">Greg Hooper</p>
        </div>

      </article>
  </main>

  

  

  

  

  
  
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Jeremiah Akpor</a>.
  </footer>
</body>
</html>
